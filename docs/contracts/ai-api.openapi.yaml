openapi: 3.1.0
info:
  title: SKRR AI 서버 내부 API
  version: 0.1.0
  description: |
    백엔드 ↔ AI 서버 계약 초안. 클러스터 내부 전용이며 Ingress로 노출하지 않는다.
    LLM 호출은 오래 걸리므로 모든 생성 작업은 202와 작업 ID를 반환하고, 백엔드가 작업을 조회한다.
    AI 서버는 업무 데이터를 DB에 쓰지 않는다. 결과를 반환하면 백엔드가 저장한다.
servers:
  - url: /internal/v1
paths:
  /healthz:
    get:
      operationId: aiHealth
      summary: 프로세스 생존 확인
      responses:
        '200': { description: 정상 }
  /readyz:
    get:
      operationId: aiReady
      summary: 요청 처리 준비 확인 (벡터 저장소 접근 가능 여부)
      responses:
        '200': { description: 준비됨 }
        '503': { description: 준비 안 됨 }
  /knowledge-bases/{projectId}/builds:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: startKnowledgeBaseBuild
      summary: S3 문서를 읽어 sqlite-vec 인덱스 구축 (WBS 4.5.2)
      description: |
        요청에는 필수 3종(REQUIREMENT, API_SPEC, CATALOG)이 각 1개씩 있어야 한다.
        빠지면 400 MISSING_REQUIRED_DOCUMENTS, 같은 종류가 2개 이상이면 400 DUPLICATE_DOCUMENT_TYPE.
        TEST_DATA가 들어 있으면 내려받지 않고 무시하며 결과 documents에도 넣지 않는다 (백엔드는 보내지 않는다).
        전체를 다시 인덱싱하며, 실패하면 기존 인덱스 파일을 바꾸지 않는다.
        STORAGE_TYPE=local 개발 환경에서는 s3Key를 DOCUMENT_SOURCE_DIR 아래 상대 경로로 읽는다 (ADR-021).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeBaseBuildRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503':
          description: 임베딩 모델이 준비되지 않음 (LLM_NOT_CONFIGURED). 백엔드는 다른 5xx와 같이 재시도 후 실패 처리한다
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /requests/refinements:
    post:
      operationId: startRequestRefinement
      summary: 자연어 요청을 RAG Top 3 근거로 N개 후보로 정제 (WBS 4.5.3, FR-02)
      description: |
        LLM이 설정되지 않았어도 202로 받고, 작업을 FAILED(error.code LLM_NOT_CONFIGURED, retryable false)로 끝낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefinementRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
  /scenarios/generations:
    post:
      operationId: startScenarioGeneration
      summary: 선택된 요청으로 시나리오·케이스 생성, 가드 검증 최대 3회 (WBS 4.5.3~4.5.5)
      description: |
        LLM이 설정되지 않았어도 202로 받고, 작업을 FAILED(error.code LLM_NOT_CONFIGURED, retryable false)로 끝낸다.
        진행 단계(progress.phase)는 RETRIEVE → PLAN(시나리오 목록 정하기) → GENERATE ⇄ GUARD 순이다.
        가드 실패 뒤 재생성 중이면 progress.message가 "가드 실패: … 재생성 중" 문장이고, "(N/3회)"는 붙이지 않는다(화면이 attempt로 붙임).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioGenerationRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
  /test-queries/generations:
    post:
      operationId: startTestQueryGeneration
      summary: 승인된 케이스를 TestQuery로 변환 (WBS 4.6, FR-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestQueryGenerationRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
  /failure-analyses:
    post:
      operationId: startFailureAnalysis
      summary: 실패 케이스의 근거를 분석해 원인 후보 제시 (FR-06, WBS 4.7)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailureAnalysisRequest' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/Invalid' }
  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAiJob
      summary: 작업 상태와 결과 조회
      responses:
        '200':
          description: 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404':
          description: 작업 없음 (JOB_NOT_FOUND. 서버 재시작으로 유실 가능. 백엔드가 재요청한다)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /jobs/{jobId}/cancel:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelAiJob
      summary: 작업 취소
      responses:
        '202': { description: 취소 요청됨 }
        '404':
          description: 작업 없음 (JOB_NOT_FOUND)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  responses:
    JobAccepted:
      description: 작업 접수
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
    Invalid:
      description: 입력값 오류 (INVALID_REQUEST, MISSING_REQUIRED_DOCUMENTS, DUPLICATE_DOCUMENT_TYPE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: '#/components/schemas/AiProblemCode' }
    AiProblemCode:
      type: string
      description: HTTP 오류 응답의 code. 백엔드는 상태 코드로 분기하고 code는 로그에 남긴다
      enum: [INVALID_REQUEST, MISSING_REQUIRED_DOCUMENTS, DUPLICATE_DOCUMENT_TYPE, JOB_NOT_FOUND, LLM_NOT_CONFIGURED]
    AiErrorCode:
      type: string
      description: |
        FAILED 작업의 error.code. KB_BUILD에서 쓰는 값은
        DOCUMENT_DOWNLOAD_FAILED(원본 읽기 실패), DOCUMENT_CHECKSUM_MISMATCH(체크섬 불일치), DOCUMENT_PARSE_FAILED(형식·ID 오류),
        INDEX_WRITE_FAILED(인덱스 파일 저장 실패), LLM_UNAVAILABLE·LLM_TIMEOUT·LLM_NOT_CONFIGURED(임베딩 호출), INTERNAL_ERROR(처리하지 못한 예외)다.
        문서 오류가 여러 종류면 PARSE > CHECKSUM > DOWNLOAD 순으로 하나를 고른다.
        검색을 쓰는 작업(REQUEST_REFINE, SCENARIO_GENERATE, TEST_QUERY_GENERATE, FAILURE_ANALYZE)은 인덱스 파일이 없으면 KNOWLEDGE_BASE_MISSING,
        구축 때와 임베딩 모델이 다르면 EMBEDDING_MODEL_MISMATCH(재구축 필요, retryable false)다. 새 값은 이 목록에 먼저 추가한다.
      enum:
        - LLM_UNAVAILABLE
        - LLM_TIMEOUT
        - LLM_NOT_CONFIGURED
        - INVALID_LLM_OUTPUT
        - DOCUMENT_DOWNLOAD_FAILED
        - DOCUMENT_CHECKSUM_MISMATCH
        - DOCUMENT_PARSE_FAILED
        - INDEX_WRITE_FAILED
        - KNOWLEDGE_BASE_MISSING
        - EMBEDDING_MODEL_MISMATCH
        - INTERNAL_ERROR
    JobType: { type: string, enum: [KB_BUILD, REQUEST_REFINE, SCENARIO_GENERATE, TEST_QUERY_GENERATE, FAILURE_ANALYZE] }
    JobStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
    DocumentType: { type: string, enum: [REQUIREMENT, API_SPEC, CATALOG, TEST_DATA] }
    VerificationScope: { type: string, enum: [UI, API, DB] }
    TestCaseType: { type: string, enum: [NORMAL, EXCEPTION, BOUNDARY] }
    Severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    FailureType:
      type: string
      enum: [DATA_MISMATCH, ASSERTION_FAILED, ELEMENT_NOT_FOUND, API_ERROR, API_SCHEMA_MISMATCH, TIMEOUT, ENVIRONMENT_ERROR, TEST_CODE_ERROR]
    Verdict: { type: string, enum: [MATCH, MISMATCH, NOT_APPLICABLE] }
    Job:
      type: object
      required: [jobId, type, status]
      properties:
        jobId: { type: string }
        type: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress:
          type: object
          properties:
            phase: { type: string, examples: [RETRIEVE, PLAN, GENERATE, GUARD, INDEX] }
            percent: { type: integer, minimum: 0, maximum: 100 }
            attempt: { type: integer, description: '가드 재시도 회차. 1이 첫 생성, 2 이상이면 가드 실패 뒤 재생성' }
            maxAttempts: { type: integer }
            scenarioCode: { type: [string, 'null'], description: SCENARIO_GENERATE에서 지금 처리 중인 시나리오 코드 (예 SC-06) }
            message: { type: string, description: 'UI-02-5 가드 실패 문구로 그대로 표시할 수 있는 문장. 회차 표시 (N/3회)는 넣지 않는다' }
        result:
          oneOf:
            - $ref: '#/components/schemas/KnowledgeBaseBuildResult'
            - $ref: '#/components/schemas/RefinementResult'
            - $ref: '#/components/schemas/ScenarioGenerationResult'
            - $ref: '#/components/schemas/TestQueryGenerationResult'
            - $ref: '#/components/schemas/FailureAnalysisResult'
            - type: 'null'
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code: { $ref: '#/components/schemas/AiErrorCode' }
                message: { type: string }
                retryable: { type: boolean, description: true면 백엔드가 같은 요청을 1회 다시 보낸다 }
            - type: 'null'
    KnowledgeBaseBuildRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          description: 활성 필수 문서 3종 각 1개. TEST_DATA는 보내지 않는다(와도 무시)
          minItems: 3
          items:
            type: object
            required: [documentId, type, version, s3Key, contentType, checksumSha256]
            properties:
              documentId: { type: string, format: uuid }
              type: { $ref: '#/components/schemas/DocumentType' }
              version: { type: integer }
              s3Key: { type: string }
              contentType: { type: string }
              checksumSha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
                description: 파일 바이트의 SHA-256, 소문자 16진수 64자 (document.checksum_sha256과 같은 값). AI 서버는 대문자 16진수와 base64도 받아들일 수 있다
    KnowledgeBaseBuildResult:
      type: object
      required: [kind, chunkCount, requirementCount, apiCount, uiElementCount, documents]
      properties:
        kind: { const: KB_BUILD }
        chunkCount: { type: integer }
        requirementCount: { type: integer }
        apiCount: { type: integer }
        uiElementCount: { type: integer }
        documents:
          type: array
          items:
            type: object
            required: [documentId, status]
            properties:
              documentId: { type: string, format: uuid }
              status:
                type: string
                enum: [INDEXED, FAILED, SKIPPED]
                description: |
                  INDEXED 인덱싱됨. FAILED 이 문서 때문에 구축이 실패함(error에 사유).
                  SKIPPED 이 문서는 문제가 없거나 확인 전이지만 다른 문서의 오류로 인덱스에 넣지 않음.
                  작업이 SUCCEEDED면 모두 INDEXED다. 작업이 FAILED이고 문서별 원인이 있으면 result를 함께 돌려주며 FAILED가 하나 이상 있다.
                  인덱스 저장·임베딩 같은 작업 전체 오류로 FAILED가 되면 result는 null이다.
              summary:
                type: object
                description: 'REQUIREMENT requirementCount, API_SPEC endpointCount, CATALOG elementCount·pageCount (platform-api Document.summary). 파싱했으면 SKIPPED여도 줄 수 있다'
                additionalProperties: { type: integer }
              error: { type: string, description: FAILED·SKIPPED일 때 화면에 보여 줄 문장 }
    Reference:
      type: object
      required: [sourceType, sourceId, excerpt, score]
      properties:
        sourceType: { $ref: '#/components/schemas/DocumentType' }
        sourceId: { type: string, examples: [FR-CART-03] }
        title: { type: string }
        excerpt: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
    RefinementRequest:
      type: object
      required: [projectId, text]
      properties:
        projectId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 500 }
        candidateCount: { type: integer, minimum: 1, maximum: 6, default: 4 }
        topK: { type: integer, minimum: 1, maximum: 10, default: 3 }
    RefinementResult:
      type: object
      required: [kind, candidates]
      properties:
        kind: { const: REQUEST_REFINE }
        candidates:
          type: array
          items:
            type: object
            required: [refinedText, references]
            properties:
              refinedText: { type: string }
              references:
                type: array
                items: { $ref: '#/components/schemas/Reference' }
    ScenarioGenerationRequest:
      type: object
      required: [projectId, testRequestCode, requestText]
      properties:
        projectId: { type: string, format: uuid }
        testRequestCode: { type: string }
        requestText: { type: string }
        firstScenarioNumber: { type: integer, minimum: 1, default: 1 }
        firstCaseNumber: { type: integer, minimum: 1, default: 1, description: 새 케이스 번호의 시작. 재생성 때는 요청 안에서 쓴 적 없는 번호(최댓값+1)를 백엔드가 준다 }
        regenerate:
          description: 시나리오 1건 재생성 시 기존 내용과 사용자 의견. scenarioCode가 없으면 400 INVALID_REQUEST
          type: [object, 'null']
          required: [scenarioCode]
          properties:
            scenarioCode: { type: string }
            previous: { $ref: '#/components/schemas/GeneratedScenario' }
            feedback: { type: string }
    GeneratedCase:
      type: object
      required: [code, title, type, scopes, steps, expectedResult, expectedValues]
      properties:
        code: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/TestCaseType' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/VerificationScope' }
        preconditions:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { type: string }
        expectedResult: { type: string }
        expectedValues:
          type: array
          minItems: 1
          description: 사용자가 승인할 기대값. TestQuery 생성 요청에서는 승인된 값이 들어온다 (ADR-017).
          items: { $ref: '#/components/schemas/ExpectedValue' }
    ExpectedValue:
      type: object
      description: expected와 consistencyOnly(true) 중 하나만 쓰고, consistencyOnly면 reason이 필수다 (platform-api ExpectedValue, ADR-017).
      required: [label]
      properties:
        label: { type: string }
        expected: { type: string }
        consistencyOnly: { type: boolean }
        reason: { type: string }
    GuardFailureKind:
      type: string
      description: CATALOG_GAP은 재생성으로 해결되지 않으므로 카탈로그 수정이 필요하다는 뜻이다 (WBS 4.5.5).
      enum: [SCHEMA_INVALID, UNKNOWN_REQUIREMENT, UNKNOWN_API, UNKNOWN_TEST_ID, UNKNOWN_VARIABLE, NO_ASSERTION, MISSING_EXPECTED, EXPECTED_NOT_APPROVED, CATALOG_GAP]
    GuardFailure:
      type: object
      required: [kind, message]
      properties:
        kind: { $ref: '#/components/schemas/GuardFailureKind' }
        message: { type: string }
        subject: { type: string, examples: [cart-remove-button] }
    GeneratedScenario:
      type: object
      required: [code, title, scopes, references, guard, testCases]
      properties:
        code: { type: string }
        title: { type: string }
        requirementRef: { type: [string, 'null'] }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/VerificationScope' }
        references:
          type: array
          items: { $ref: '#/components/schemas/Reference' }
        guard:
          type: object
          required: [passed, attempts, failures]
          properties:
            passed: { type: boolean }
            attempts: { type: integer, minimum: 1, maximum: 3 }
            failures:
              type: array
              description: 마지막 시도의 가드 실패만 담는다. 통과했으면 빈 배열. 지난 시도 이력은 넣지 않는다
              items: { $ref: '#/components/schemas/GuardFailure' }
        testCases:
          type: array
          items: { $ref: '#/components/schemas/GeneratedCase' }
    ScenarioGenerationResult:
      type: object
      required: [kind, scenarios]
      properties:
        kind: { const: SCENARIO_GENERATE }
        scenarios:
          type: array
          items: { $ref: '#/components/schemas/GeneratedScenario' }
    TestQueryGenerationRequest:
      type: object
      required: [projectId, scenario, testCase]
      properties:
        projectId: { type: string, format: uuid }
        scenario:
          type: object
          required: [code, title]
          properties:
            code: { type: string }
            title: { type: string }
            requirementRef: { type: [string, 'null'] }
        testCase: { $ref: '#/components/schemas/GeneratedCase' }
        availableVariables:
          type: array
          description: |
            TEST_DATA 문서의 variables와 secrets 이름. 값은 보내지 않는다. LLM은 {{이름}}으로만 참조하고, 없는 이름을 쓰면 가드가 거부한다.
            생성된 TestQuery의 variables는 비워 두며, 값은 실행 때 백엔드가 채운다 (target-site-contract.md "테스트 데이터").
          items: { type: string }
        queryApiBaseUrl:
          type: [string, 'null']
          format: uri
          description: |
            프로젝트 설정의 읽기 전용 조회 API 주소(platform Project.queryApiBaseUrl 그대로). 있으면 가드가 dbChecks[].path가 이 주소의 경로로 시작하는지 검사하고, 아니면 UNKNOWN_API로 재생성한다.
            없으면 지금처럼 명세의 읽기 전용 GET인지만 검사한다. 백엔드는 이와 별개로 준비 단계에서 같은 규칙을 다시 검사한다 (state-machines.md Run).
        previousError:
          description: 이전 변환이 컴파일이나 스키마 검증에 실패한 경우의 오류. 다음 시도에 반영한다.
          type: [string, 'null']
    TestQueryGenerationResult:
      type: object
      required: [kind, testQuery, guard]
      properties:
        kind: { const: TEST_QUERY_GENERATE }
        testQuery: { $ref: './schemas/test-query.schema.json' }
        guard:
          type: object
          required: [passed, attempts, failures]
          properties:
            passed: { type: boolean }
            attempts: { type: integer }
            failures:
              type: array
              items: { $ref: '#/components/schemas/GuardFailure' }
    FailureAnalysisRequest:
      type: object
      description: FAILED 케이스만 보낸다. 비밀값과 secretCaptures 값은 넣지 않는다.
      required: [projectId, caseCode, caseTitle, expectedResult, failureType, failureMessage, steps, apiCalls, verifications]
      properties:
        projectId: { type: string, format: uuid }
        caseCode: { type: string }
        caseTitle: { type: string }
        requirementRef: { type: [string, 'null'] }
        expectedResult: { type: string }
        failureType:
          $ref: '#/components/schemas/FailureType'
          description: 규칙으로 정한 실패 유형. AI는 이 값을 바꾸지 않고 원인 후보의 근거로 쓴다
        failureMessage: { type: string }
        attempts: { type: integer }
        failedAttempts: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [order, kind, title, status]
            properties:
              order: { type: integer }
              kind: { type: string }
              title: { type: string }
              status: { type: string }
              detail: { type: string }
              expectedValue: { type: string }
              actualValue: { type: string }
              schemaCheck: { type: string, enum: [PASSED, FAILED, NOT_CHECKED] }
        apiCalls:
          type: array
          items:
            type: object
            required: [method, path]
            properties:
              method: { type: string }
              path: { type: string }
              statusCode: { type: integer }
              durationMs: { type: integer }
        verifications:
          type: array
          items:
            type: object
            required: [itemLabel, verdict]
            properties:
              itemLabel: { type: string }
              uiValue: { type: string }
              apiValue: { type: string }
              dbValue: { type: string }
              expectedValue: { type: string }
              verdict: { $ref: '#/components/schemas/Verdict' }
        consoleErrors:
          type: array
          description: 'MVP에서는 보내지 않는다(빈 배열 또는 생략). 실행기의 브라우저 콘솔 오류를 로그로만 남기고 저장하지 않기 때문이다. AI는 이 값 없이도 분석해야 한다'
          items: { type: string }
        specSource: { type: string }
    FailureAnalysisResult:
      type: object
      description: failureType은 돌려주지 않는다. 실패 유형은 백엔드가 규칙으로 정한다 (state-machines.md "실패 원인 분석").
      required: [kind, severity, affectedFeatures, rootCauses]
      properties:
        kind: { const: FAILURE_ANALYZE }
        severity: { $ref: '#/components/schemas/Severity' }
        affectedFeatures:
          type: array
          items: { type: string }
        rootCauses:
          type: array
          maxItems: 5
          items:
            type: object
            required: [rank, description, confidencePct, evidence]
            properties:
              rank: { type: integer, minimum: 1 }
              description: { type: string }
              confidencePct: { type: integer, minimum: 0, maximum: 100 }
              evidence:
                type: array
                minItems: 1
                description: 요청에 포함된 실제 값만 인용한다. 근거 없는 후보는 내보내지 않는다.
                items: { type: string }
              remediation: { type: string }
