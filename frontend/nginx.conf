# 프론트 컨테이너 nginx 설정 (conf.d/default.conf로 들어간다)
# - /api/ 는 백엔드로만 보낸다. AI·실행기 직접 경로는 만들지 않는다 (ADR-009)
# - 업로드 파일 20MB 제한은 Spring이 건다. 여기서는 multipart 오버헤드를 포함해 21MB
# - SSE는 버퍼링을 끄고 읽기 제한을 3600초로 둔다 (UI-03)
# 백엔드 호스트 이름 backend 는 compose 서비스 이름이자 k8s Service 이름이다.
#
# 전달 헤더: backend는 server.forward-headers-strategy=native(Tomcat RemoteIpValve)로 링크(로컬 다운로드 등)를 만든다.
# - RemoteIpValve는 요청을 보낸 주소가 내부 프록시 대역(10/8, 172.16/12, 192.168/16, 100.64/10, 127/8 등)일 때만
#   전달 헤더를 믿는다. nginx 파드(k8s Pod CIDR)와 compose 브리지 주소가 여기에 든다.
# - X-Forwarded-Proto가 있으면 포트를 X-Forwarded-Port로 정하고, 없으면 http 80 / https 443으로 둔다.
#   X-Forwarded-Host의 포트는 무시하므로 브라우저가 보는 포트(3000, 8088)를 X-Forwarded-Port로 따로 보낸다.
# - 앞단(Traefik 등)이 보낸 X-Forwarded-Proto가 있으면 유지한다 (TLS 종료가 앞단일 때 https 링크).

map $http_x_forwarded_proto $skrr_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $skrr_forwarded_proto $skrr_default_port {
    https   443;
    default 80;
}

# 브라우저가 보낸 Host의 포트. 없으면 프로토콜 기본 포트
map $http_host $skrr_forwarded_port {
    "~:(?<skrr_host_port>[0-9]+)$" $skrr_host_port;
    default                        $skrr_default_port;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 21M;

    # 실행 실시간 이벤트 (SSE). 정규식 location이 /api/ 접두사보다 먼저 일치한다.
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $skrr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $skrr_forwarded_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $skrr_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $skrr_forwarded_port;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # 해시가 붙은 정적 파일은 오래 캐시한다
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅. index.html은 캐시하지 않는다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
