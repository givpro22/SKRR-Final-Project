    caseCode: TC-07
    caseTitle: 결제 합계 금액 확인
    requirementRef: FR-ORD-01
    expectedResult: 결제 화면·API·DB 합계가 같다
    failureType: DATA_MISMATCH
    failureMessage: 교차 검증 '결제 합계 금액'이 일치하지 않아요
    attempts: 3
