    steps:
      - { order: 5, kind: API, title: 주문 API, status: PASSED, expectedValue: "201", actualValue: "201" }
    apiCalls:
      - { method: POST, path: /api/orders, statusCode: 201, durationMs: 40 }
    verifications:
      - { itemLabel: 결제 합계 금액, uiValue: "45,000원", apiValue: "50000", dbValue: "45000", expectedValue: "45000", verdict: MISMATCH }
