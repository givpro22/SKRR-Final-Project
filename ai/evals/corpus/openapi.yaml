# 목업 쇼핑몰 API 명세 (평가용 예제). 형식은 backend 템플릿(api_spec_template.yaml)과 같다.
openapi: 3.0.3
info: { title: 목업 쇼핑몰 API, version: 1.0.0 }
servers:
  - url: https://shop.example.test/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Token:
      type: object
      required: [accessToken]
      properties: { accessToken: { type: string } }
    Product:
      type: object
      required: [productId, name, price, stock]
      properties:
        productId: { type: integer }
        name: { type: string }
        price: { type: integer, description: 원 단위 }
        stock: { type: integer }
    CartItem:
      type: object
      required: [productId, quantity, price]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        price: { type: integer }
    Cart:
      type: object
      required: [items, totalAmount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        totalAmount: { type: integer }
    Order:
      type: object
      required: [orderId, status, totalAmount]
      properties:
        orderId: { type: string }
        status: { type: string, enum: [PAID, SHIPPING, DELIVERED, CANCELLED] }
        totalAmount: { type: integer }
    Coupon:
      type: object
      required: [couponId, name, discountAmount, minOrderAmount, expiresAt]
      properties:
        couponId: { type: string }
        name: { type: string }
        discountAmount: { type: integer }
        minOrderAmount: { type: integer }
        expiresAt: { type: string, format: date }
paths:
  /auth/login:
    post:
      operationId: login
      summary: 회원 로그인 (FR-MEM-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '200':
          description: 로그인 성공
          content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } }
        '401': { description: 인증 실패 }
  /members:
    post:
      operationId: signUp
      summary: 회원 가입 (FR-MEM-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8, maxLength: 20 }
                name: { type: string }
      responses:
        '201': { description: 가입됨 }
        '409': { description: 이미 가입한 이메일 }
  /products:
    get:
      operationId: listProducts
      summary: 상품 목록 조회 (FR-PRD-01)
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: 상품 목록
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
  /products/{productId}:
    get:
      operationId: getProduct
      summary: 상품 상세 조회 (FR-PRD-02)
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 상품
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { description: 없는 상품 }
  /products/search:
    get:
      operationId: searchProducts
      summary: 상품 검색 (FR-SRCH-01)
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 30 } }
      responses:
        '200':
          description: 검색 결과
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
        '400': { description: 검색어 길이 오류 }
  /cart:
    get:
      operationId: getCart
      summary: 장바구니 조회와 합계 금액 (FR-CART-04)
      responses:
        '200':
          description: 장바구니
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
  /cart/items:
    post:
      operationId: addCartItem
      summary: 장바구니 담기 (FR-CART-01)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartItem' } } }
      responses:
        '201':
          description: 담김
          content: { application/json: { schema: { $ref: '#/components/schemas/CartItem' } } }
        '409': { description: 재고 부족 }
  /cart/items/{productId}:
    patch:
      operationId: updateCartItemQuantity
      summary: 장바구니 수량 변경 (FR-CART-02)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer } } }
      responses:
        '200':
          description: 변경됨
          content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
        '400': { description: 수량 범위 오류 }
    delete:
      operationId: removeCartItem
      summary: 장바구니 상품 삭제 (FR-CART-03)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 삭제됨 }
        '404': { description: 장바구니에 없는 상품 }
  /orders:
    post:
      operationId: createOrder
      summary: 주문 결제 (FR-ORD-01)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { couponId: { type: [string, 'null'] } } }
      responses:
        '201':
          description: 주문 생성
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '400': { description: 쿠폰 최소 주문 금액 미달 }
    get:
      operationId: listOrders
      summary: 주문 내역 조회 (FR-ORD-02)
      responses:
        '200':
          description: 주문 목록
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: 주문 취소 (FR-ORD-03)
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 취소됨
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '409': { description: 배송이 시작된 주문 }
  /coupons:
    get:
      operationId: listCoupons
      summary: 쿠폰 목록 조회 (FR-CPN-01)
      responses:
        '200':
          description: 보유 쿠폰
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Coupon' } } } }
  /orders/coupon-preview:
    post:
      operationId: previewCoupon
      summary: 쿠폰 적용 미리보기 (FR-CPN-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [couponId], properties: { couponId: { type: string } } }
      responses:
        '200': { description: 할인 적용 금액 }
        '400': { description: 최소 주문 금액 미달 }
  /products/{productId}/reviews:
    post:
      operationId: createReview
      summary: 상품 리뷰 작성 (FR-REV-01)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, content]
              properties: { rating: { type: integer, minimum: 1, maximum: 5 }, content: { type: string } }
      responses:
        '201': { description: 작성됨 }
        '403': { description: 구매하지 않은 상품 }
  /members/me/address:
    put:
      operationId: updateAddress
      summary: 배송지 변경 (FR-DLV-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zipCode, address, phone]
              properties: { zipCode: { type: string, pattern: '^[0-9]{5}$' }, address: { type: string }, phone: { type: string } }
      responses:
        '200': { description: 변경됨 }
        '400': { description: 우편번호 형식 오류 }
  # DB 확인용 읽기 전용 조회 API (target-site-contract.md). X-Test-Control-Token으로 보호한다.
  /test/query/cart-items:
    get:
      operationId: queryCartItems
      summary: 장바구니 행 조회 (읽기 전용)
      security: []
      parameters:
        - { name: memberEmail, in: query, required: true, schema: { type: string } }
        - { name: X-Test-Control-Token, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: 조회 결과
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CartItem' } } } }
  /test/query/orders:
    get:
      operationId: queryOrders
      summary: 주문 행 조회 (읽기 전용)
      security: []
      parameters:
        - { name: memberEmail, in: query, required: true, schema: { type: string } }
        - { name: X-Test-Control-Token, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: 조회 결과
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } }
