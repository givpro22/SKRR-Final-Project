# AI 서버: sqlite-vec 파일을 RWO PVC에 두므로 1 레플리카 + Recreate (ADR-004)
apiVersion: v1
kind: ConfigMap
metadata:
  name: skrr-ai
  labels:
    app.kubernetes.io/name: ai
data:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: ""
  # ADR-010 결정 전에는 가짜 클라이언트
  LLM_PROVIDER: fake
  LLM_MODEL: ""
  EMBEDDING_MODEL: ""
  LLM_BASE_URL: ""
  KB_DATA_DIR: /data/kb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-kb
  labels:
    app.kubernetes.io/name: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  labels:
    app.kubernetes.io/name: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels:
    app.kubernetes.io/name: ai
spec:
  replicas: 1
  # RWO 볼륨을 잡은 이전 파드가 남아 있으면 새 파드가 시작하지 못한다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai
          image: skrr/ai:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: skrr-ai
            # LLM_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
            - secretRef:
                name: skrr-ai
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /internal/v1/readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /internal/v1/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 2Gi }
          volumeMounts:
            - name: kb
              mountPath: /data/kb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kb
          persistentVolumeClaim:
            claimName: ai-kb
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
