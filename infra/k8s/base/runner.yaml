# 실행기: LLM 출력에서 파생된 동작을 실행하므로 가장 엄격하게 격리한다 (ADR-005)
# - Secret을 주지 않는다 (DB, AWS, LLM 키 없음). 증거는 백엔드가 준 presigned URL로 올린다
# - 서비스 어카운트 토큰 없음, 비루트, 권한 상승 없음, 루트 파일시스템 읽기 전용
# - 송신 제한은 networkpolicy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: skrr-runner
  labels:
    app.kubernetes.io/name: runner
data:
  # 쉼표 구분 허용 대상 호스트. overlay에서 대상 사이트 주소로 채운다
  RUNNER_ALLOWED_TARGET_HOSTS: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  labels:
    app.kubernetes.io/name: runner
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  labels:
    app.kubernetes.io/name: runner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: runner
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  labels:
    app.kubernetes.io/name: runner
spec:
  # 동시 실행 1건
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner
    spec:
      serviceAccountName: runner
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: skrr/runner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: skrr-runner
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # readyz는 유휴 상태에서만 통과하므로 프로브에 쓰지 않는다.
          # 쓰면 실행 중에 Service에서 빠져 진행 조회와 중단 요청이 끊긴다.
          readinessProbe:
            httpGet: { path: /internal/v1/healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /internal/v1/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2000m, memory: 2Gi }
          volumeMounts:
            # spec 파일, trace, HAR, 스크린샷 임시 저장
            - name: tmp
              mountPath: /tmp
            # Chromium 공유 메모리. 메모리 제한에 포함된다
            - name: dshm
              mountPath: /dev/shm
            - name: home
              mountPath: /home/runner
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
