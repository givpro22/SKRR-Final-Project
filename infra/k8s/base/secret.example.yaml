# Secret 구조 예시. kustomization.yaml에 포함하지 않으며 값은 비워 둔다.
# 이 저장소는 공개 상태다. 실제 값은 클러스터에서 직접 만들고 커밋하지 않는다.
# 로컬(kind): infra/k8s/overlays/local/create-secrets.sh
# 서비스에는 자기에게 필요한 값만 준다. 실행기(runner)에는 Secret이 없다 (ADR-005).
apiVersion: v1
kind: Secret
metadata:
  name: skrr-backend
  namespace: skrr
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  TEST_CONTROL_TOKEN: ""
  # STORAGE_TYPE=local일 때 다운로드 링크 서명 키. 비우면 시작할 때 임의 값(재시작하면 이전 링크 무효)
  LOCAL_STORAGE_SIGNING_KEY: ""
  # 클러스터 신원 연동(EKS IRSA 등)을 쓰면 아래 두 키를 뺀다
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: skrr-ai
  namespace: skrr
type: Opaque
stringData:
  LLM_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: skrr-postgres
  namespace: skrr
type: Opaque
stringData:
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  # ConfigMap skrr-backend의 SPRING_DATASOURCE_URL에 있는 DB 이름과 같게 둔다
  POSTGRES_DB: skrr
---
# Traefik BasicAuth Middleware가 읽는다. users 키는 htpasswd 형식 (예: user:$apr1$...)
apiVersion: v1
kind: Secret
metadata:
  name: skrr-basic-auth
  namespace: skrr
type: Opaque
stringData:
  users: ""
